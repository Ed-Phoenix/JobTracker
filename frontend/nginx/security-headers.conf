# Included in every location that serves the app. (In Nginx, a location with its own add_header
# stops inheriting the server's add_header lines, so they live in one snippet included everywhere.)

# Content Security Policy: the browser only runs scripts and loads data from this same origin,
# which blocks most injected-script (XSS) attacks. 'unsafe-inline' is allowed for styles only,
# because the chart library sets inline style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Do not let other sites embed this app in a frame (clickjacking).
add_header X-Frame-Options "DENY" always;

# Do not let the browser guess content types (e.g. run a text file as a script).
add_header X-Content-Type-Options "nosniff" always;

# Send only the origin, never the full URL with ids, when following external links.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
