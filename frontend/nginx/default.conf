# Nginx serves the built React app and forwards API calls to the ASP.NET Core container.
# The browser only ever talks to this server (one origin), exactly like the Vite proxy in
# development: no CORS, and the SameSite=Strict refresh cookie works.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Do not advertise the Nginx version in responses.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- API (and its docs) -> the "api" service of docker-compose ----------
    location ~ ^/(api|scalar|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API reads these to know the real client IP and scheme (see ForwardedHeaders in Program.cs).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Built assets: file names contain a content hash, so they can be cached forever ----------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---------- Everything else: the single-page app ----------
    # A URL like /applications/123 has no file on disk; React Router handles it in the browser,
    # so Nginx answers with index.html. index.html itself is never cached, so a new deploy is
    # picked up on the next visit.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
