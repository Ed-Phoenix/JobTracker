name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint, typecheck, test and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says (reproducible, fails if it is out of date).
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker (build images and smoke-test the stack)
    runs-on: ubuntu-latest
    # Only after the code itself is known to be good.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cp .env.example .env
          # A fresh random signing key per run; the other example values are fine for a throwaway stack.
          sed -i "s/^JWT_SIGNING_KEY=.*/JWT_SIGNING_KEY=$(openssl rand -hex 32)/" .env

      - name: Build and start the stack
        run: docker compose up --build --detach

      # The same check a reviewer would do: the app is served and the API answers through Nginx.
      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if [ "$(curl -s http://localhost:8080/api/health)" = "Healthy" ]; then
              echo "API healthy through Nginx"
              curl -sf http://localhost:8080/ | grep -q '<div id="root">'
              curl -sf -o /dev/null http://localhost:8080/applications
              echo "SPA served"
              exit 0
            fi
            sleep 3
          done
          echo "Stack did not become healthy"
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
